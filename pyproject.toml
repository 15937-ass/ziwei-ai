[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziwei-ai"
version = "0.1.0"
description = "Evidence-grounded Zi Wei Dou Shu AI inference research and product prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1,<2028"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
