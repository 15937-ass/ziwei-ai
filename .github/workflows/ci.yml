name: Python and iztro chart checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chart-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        run: python -m pip install -e '.[dev]'
      - name: Install pinned JS chart library
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Node chart regression tests
        run: npm test
      - name: Python chart and time tests
        run: python -m pytest -q
      - name: Generate source-grounded Wang placement audit
        run: node tools/audit_wang_rules.mjs
      - name: Generate extended independent placement oracles
        run: node tools/audit_wang_extra.mjs
      - name: Publish placement differences for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wang-placement-audit
          path: |
            audit_out/wang_location_audit.json
            audit_out/wang_extra_audit.json
          if-no-files-found: warn
          retention-days: 30
